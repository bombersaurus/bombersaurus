name: Build Work Hub App

on:
  push:
    branches: [main]
    paths:
      - "assets/app-chunks/**"
      - ".github/workflows/build-work-hub-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct application
        shell: bash
        run: |
          cat assets/app-chunks/0.txt assets/app-chunks/1.txt assets/app-chunks/2.txt assets/app-chunks/3.txt \
            | base64 --decode \
            | gzip --decompress > app.js
          node --check app.js
          test -s app.js

      - name: Commit generated app
        shell: bash
        run: |
          git config user.name "Work Hub Build"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "app.js already up to date"
          else
            git commit -m "Build Work Hub application"
            git push
          fi
